worker_processes 4;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        root  /usr/share/nginx/html;

        # External assets, mounted read-only from the host (see docker-compose.yml)
        location /assets/data/ {
            alias /srv/assets/data/;
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location /assets/images/ {
            alias /srv/assets/images/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Vite's hashed build output: cache forever, never fall back to index.html
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
