networks:
  web:
    external: true
  internal:
    external: false

services:
  website:
    container_name: pokedex-website-prod
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.pokedex-website.rule=Host(`pokedex.magicmediamuse.com`)
      - traefik.http.routers.pokedex-website.tls=true
      - traefik.http.routers.pokedex-website.tls.certresolver=lets-encrypt
      - traefik.http.services.pokedex-website.loadbalancer.server.port=80
    networks:
      - internal
      - web
    volumes:
      # Host directory containing data/ and images/ (PokeAPI data + sprites).
      # Relative paths resolve from this file, so this matches the Vite dev default.
      - ${POKEDEX_ASSETS_DIR:-../pokedex-assets}:/srv/assets:ro
    build: .
    image: pokedex/website
